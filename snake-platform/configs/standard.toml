# The respawn profile: a forgiving board for practice and demonstration.
#
# Battlesnake-shaped rules on an 11x11 board, four snakes to a game, with
# respawns on — an eliminated snake comes back at a safe cell a few turns
# later, every game runs the full turn cap, and results rank on food eaten and
# kills.
#
# **This is not what the league marks on.** League games use
# `configs/classic.toml`: a wrapped board, no respawns, last snake standing.
#
# Changing any value here moves the configuration hash, which is what makes a
# result reproducible — tune between cohorts, never mid-season.

[game]
snakes_per_game = 4
max_turns = 500
seed = 1234

[snake]
start_length = 5
growth_per_food = 5

[food]
starting_food_centre = 1
spawn_chance = 0.15
minimum = 1
[rules]
wrapped = false
head_to_head = "longer_wins"
respawn = true
respawn_delay_turns = 5

[evaluation]
per_move_timeout_ms = 100.0
max_consecutive_failures = 3
record_replays = "failures_and_samples"
max_debug_bytes = 4096

# --- the map pool --------------------------------------------------------------
# A game draws one map from this list by seed. Spawn points are shuffled per seed
# and the first `snakes_per_game` are used.

[[map]]
id = "arena"
name = "Arena"
width = 11
height = 11
spawns = [[1, 1], [1, 9], [9, 1], [9, 9], [5, 1], [5, 9], [1, 5], [9, 5]]

[[map]]
id = "pillars"
name = "Pillars"
width = 11
height = 11
# No obstacles this year: the stdio protocol does not carry them, so a snake
# cannot be told one is there. A board with obstacles would be a board full of
# invisible walls.
obstacles = []
spawns = [[1, 1], [1, 9], [9, 1], [9, 9], [5, 1], [5, 9], [1, 5], [9, 5]]

[[map]]
id = "royale"
name = "Royale"
width = 11
height = 11
spawns = [[1, 1], [1, 9], [9, 1], [9, 9], [5, 1], [5, 9], [1, 5], [9, 5]]
