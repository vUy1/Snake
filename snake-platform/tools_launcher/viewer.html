<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Snake · Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap" />
<style>
  /* ---- the house style -------------------------------------------------------
     Sumi-e botanical: laid-paper ground, dry brush-stroke serpents, a red seal
     for food. */
  :root {
    --paper: #f4f1e8;
    --paper-2: #efeadd;
    --panel: #eae4d4;
    --sumi: #1a1a17;
    --ink-soft: #4a463d;
    --dim: #837c6a;
    --line: #d8d1bd;
    --seal: #c8452f;
    --bleed: #9a988f;
    --accent: #2f3d6b;
    --serif: "Newsreader", "Iowan Old Style", Georgia, "Times New Roman", serif;
    --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--sumi); font-family: var(--serif); }
  body {
    display: grid;
    grid-template-columns: 1fr 320px;
    grid-template-rows: auto 1fr auto;
    grid-template-areas: "head head" "board side" "time time";
    gap: 1px;
    background: var(--line);
  }
  header {
    grid-area: head; background: var(--paper-2); padding: 12px 20px;
    display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap;
    border-bottom: 1px solid var(--line);
  }
  header h1 {
    margin: 0; font-size: 20px; font-weight: 500; letter-spacing: .01em;
  }
  header h1 small { font-size: 12px; color: var(--dim); font-family: var(--mono); letter-spacing: .12em; text-transform: uppercase; margin-left: 8px; }
  header .meta { font-family: var(--mono); font-size: 11px; color: var(--dim); letter-spacing: .04em; }
  header .meta b { color: var(--sumi); font-weight: 500; }

  #stage { grid-area: board; background: #16240f; display: grid; place-items: center; overflow: hidden; padding: 16px; }
  canvas { max-width: 100%; max-height: 100%; }

  aside {
    grid-area: side; background: var(--panel); padding: 12px; overflow-y: auto;
    display: flex; flex-direction: column; gap: 12px;
  }
  .card { border: 1px solid var(--line); background: var(--paper-2); }
  .card h2 {
    margin: 0; padding: 8px 12px; font-family: var(--mono); font-size: 10px; letter-spacing: .16em;
    text-transform: uppercase; color: var(--dim); border-bottom: 1px solid var(--line); font-weight: 500;
  }
  .snake-row { padding: 9px 12px; border-bottom: 1px solid var(--line); }
  .snake-row:last-child { border-bottom: 0; }
  .snake-row.dead { opacity: .45; }
  .snake-row .name { display: flex; align-items: center; gap: 8px; font-size: 15px; }
  .swatch { width: 11px; height: 11px; border-radius: 2px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.22); flex: none; }
  .snake-row .rank { margin-left: auto; font-family: var(--mono); font-size: 10px; color: var(--dim); letter-spacing: .06em; }
  .snake-row .stat { font-family: var(--mono); font-size: 10px; color: var(--dim); margin-top: 3px; letter-spacing: .04em; }
  .bar { height: 3px; background: var(--line); margin-top: 6px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); }

  #events { font-size: 12.5px; line-height: 1.65; color: var(--ink-soft); max-height: 230px; overflow-y: auto; padding: 9px 12px; }
  #events .ev { border-bottom: 1px dotted var(--line); padding: 2px 0; }
  #events .ev:last-child { border-bottom: 0; }
  #events .ev .t { font-family: var(--mono); font-size: 10px; color: var(--dim); }
  #events .ev.kill { color: var(--seal); }
  #events .ev.eat { color: #6a5220; }

  footer {
    grid-area: time; background: var(--paper-2); border-top: 1px solid var(--line);
    padding: 9px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  footer button, footer .seg {
    background: var(--paper); color: var(--sumi); border: 1px solid var(--line);
    font-family: var(--mono); font-size: 11px; padding: 6px 12px; cursor: pointer;
    letter-spacing: .08em; text-transform: uppercase;
  }
  footer button:hover { border-color: var(--sumi); }
  footer .seg { display: inline-flex; padding: 0; overflow: hidden; }
  footer .seg button { border: 0; border-right: 1px solid var(--line); }
  footer .seg button:last-child { border-right: 0; }
  footer .seg button.on { background: var(--sumi); color: var(--paper); }
  footer input[type=range] { flex: 1; min-width: 120px; accent-color: var(--seal); }
  footer .turn { font-family: var(--mono); font-size: 11px; color: var(--dim); min-width: 92px; }
  footer select {
    background: var(--paper); color: var(--sumi); border: 1px solid var(--line);
    font-family: var(--mono); font-size: 11px; padding: 5px;
  }
  @media (max-width: 820px) {
    body { grid-template-columns: 1fr; grid-template-areas: "head" "board" "side" "time"; }
    aside { max-height: 40vh; }
  }

  /* ---- chrome off ------------------------------------------------------
     What the broadcast embeds: the board and nothing else. The page still
     has a header, a side panel and a transport - they are simply not part of
     a broadcast, which has its own bar saying the same things in its own
     voice. Kept as a display switch rather than a second viewer so there is
     one drawing of a game in the platform and not two. */
  /* One row as well as one column: the three-row track the page normally has
     leaves the board in an auto row the height of its own canvas, which is
     the height the canvas is then measured against. It settles at the
     minimum and the broadcast shows a postage stamp. */
  body.chromeless {
    grid-template-columns: 1fr; grid-template-rows: 1fr;
    grid-template-areas: "board"; gap: 0;
  }
  body.chromeless header,
  body.chromeless aside,
  body.chromeless footer { display: none; }
  body.chromeless #stage { padding: 0; background: #16240f; }
</style>
</head>
<body>
<header>
  <h1>Snake <small>viewer</small></h1>
  <span class="meta">MAP <b id="m-map">—</b></span>
  <span class="meta">SEED <b id="m-seed">—</b></span>
  <span class="meta">TURN <b id="m-turn">0</b></span>
  <span class="meta" id="m-status">—</span>
</header>

<div id="stage"><canvas id="board" width="720" height="720"></canvas></div>

<aside>
  <div class="card"><h2>Serpents</h2><div id="snakes"></div></div>
  <div class="card"><h2>Scroll</h2><div id="events"></div></div>
</aside>

<footer>
  <button id="play">▶ play</button>
  <button id="step">step ▸</button>
  <input type="range" id="scrub" min="0" max="0" value="0" />
  <span class="turn" id="scrub-label">0 / 0</span>
  <span class="seg" id="view-seg">
    <button data-view="flat" class="on">flat</button>
    <button data-view="iso">iso · 3d</button>
  </span>
  <select id="speed">
    <option value="0.5">0.5&times;</option>
    <option value="1">1&times;</option>
    <option value="2" selected>2&times;</option>
    <option value="3">3&times;</option>
    <option value="4">4&times;</option>
    <option value="8">8&times;</option>
  </select>
</footer>

<script>
/* One colour per snake, chosen against the field rather than for its own sake.
 *
 * The ground is a deep green (`washi`, below), so every one of these clears
 * 3:1 luminance contrast against both the grass and its mown stripe - the
 * WCAG bar for a shape you have to be able to find - and every one sits at
 * least 40 degrees of hue away from the red of the food, so a snake is never
 * mistaken for an apple. Reds and olives are absent for exactly those two
 * reasons: they vanish into the turf or they read as food. */
const HUES = ["#f7d84b","#6fd6ff","#ff8ae2","#c08cff","#f7f2e4","#8fb0ff","#36e8b4","#9ee493",
              "#ffd166","#7fc8f8","#f4a3e0","#d0a9ff","#efe7d2","#a3bfff","#5fe0c0","#b7e4a0"];

/* One turn at 1x. Everything the select offers is a multiple of this, so a
 * speed is a number a reader can say out loud - 1x is the pace a game is meant
 * to be watched at, 4x is four times that - rather than an interval in
 * milliseconds that goes the other way round. Four turns a second is about as
 * fast as a move can still be followed by eye: at 1x a reader can see which
 * way each snake turned and why, which is the whole point of a replay. The
 * faster options are for skimming a game you have already understood.
 *
 * The select opens on 2x rather than 1x, and that is the default every surface
 * gets - the spotlight, a watch page, the launcher, the cup broadcast - because
 * none of them passes a speed of its own. 1x is the pace to study a game at;
 * 2x is the pace to watch one at. Changing the `selected` option below moves
 * all of them together, which is the point of keeping the default here rather
 * than in each caller's URL. */
const TURN_MS = 240;
const speed = () => Math.max(0.1, +$("speed").value || 1);

const state = { frames: [], header: null, idx: 0, playing: false, timer: null, live: false, ended: false, told: false, view: "flat" };
try { const v = localStorage.getItem("snk.view"); if (v === "iso" || v === "flat") state.view = v; } catch (e) {}
{ const qv = new URLSearchParams(location.search).get("view"); if (qv === "iso" || qv === "flat") state.view = qv; }

const $ = (id) => document.getElementById(id);
const canvas = $("board");
const ctx = canvas.getContext("2d");
const hue = (id) => HUES[id % HUES.length];

/* An apple: a red body, a lighter cheek where the light catches it, a pale
   rim so it is findable by brightness as well as by colour, and a stalk.
   Red on green is the one pairing colour-blind readers cannot separate by hue
   alone, so the rim is doing real work rather than decoration. */
function apple(cx, cy, r) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.fillStyle = "rgba(10,22,8,0.35)";                 // it sits in the grass
  ctx.beginPath(); ctx.ellipse(0, r * 0.82, r * 0.95, r * 0.30, 0, 0, 7); ctx.fill();
  ctx.fillStyle = "#e03131";
  ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill();
  ctx.fillStyle = "rgba(255,170,150,0.55)";
  ctx.beginPath(); ctx.ellipse(-r * 0.30, -r * 0.32, r * 0.30, r * 0.22, -0.6, 0, 7); ctx.fill();
  ctx.strokeStyle = "rgba(255,236,228,0.80)";
  ctx.lineWidth = Math.max(1, r * 0.13);
  ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.stroke();
  ctx.strokeStyle = "#5a3a1c";                          // stalk
  ctx.lineWidth = Math.max(1, r * 0.16);
  ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(0, -r * 0.85); ctx.lineTo(r * 0.22, -r * 1.35); ctx.stroke();
  ctx.restore();
}

/* deterministic wobble, so the field does not shimmer between redraws */
function jrand(seed) { return () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }; }

/* ------------------------------------------------------------------- field
   The board is a lawn: a deep green ground, mown in bands, with blades and
   clumps drawn over it. It is painted under the game, so none of it can ever
   be mistaken for a rule - there is nothing on this field but the snakes and
   the apple.

   Deep on purpose. Eight snakes have to be told apart at a glance, and the
   only way bright colours stay bright is if the thing behind them is dark; a
   mid-green field makes every snake muddy. See `HUES` for the other half of
   that bargain.

   The turf is expensive to draw and never changes, so it is painted once into
   an offscreen canvas and stamped from there on every frame. */

let turfBuf = null;
function turf(w, h) {
  if (turfBuf && turfBuf.width === w && turfBuf.height === h) return turfBuf;
  turfBuf = turfBuf || document.createElement("canvas");
  turfBuf.width = w; turfBuf.height = h;
  const c = turfBuf.getContext("2d");
  const rng = jrand(0x77a5);

  // Flat green first. Everything after this is texture on top of it, and the
  // field has to stay dark: the snakes are bright, and the whole reason the
  // ground is this deep is so that eight of them can sit on it and still be
  // told apart at a glance.
  c.fillStyle = "#28431f";
  c.fillRect(0, 0, w, h);

  // Mown stripes, the way a pitch is cut - wide, soft-edged, barely there.
  // They give the eye a sense of a surface without drawing a grid on it.
  const band = Math.max(28, h / 14);
  for (let y = 0; y < h; y += band * 2) {
    c.fillStyle = "rgba(60,99,48,0.38)";
    c.fillRect(0, y, w, band);
  }

  // Patches: the uneven colour of real turf, some of it thicker, some worn.
  for (let i = 0; i < (w * h) / 3400; i++) {
    const x = rng() * w, y = rng() * h, r = 10 + rng() * 34;
    c.fillStyle = rng() < 0.5 ? "rgba(23,58,18,0.11)" : "rgba(74,116,58,0.09)";
    c.beginPath(); c.arc(x, y, r, 0, 7); c.fill();
  }

  // Blades. Short strokes leaning off the vertical, in a few greens, drawn
  // thickly enough to read as grass up close and as tone from across a room.
  const blades = ["rgba(96,142,70,0.55)", "rgba(58,98,45,0.60)",
                  "rgba(120,166,86,0.40)", "rgba(40,74,32,0.55)"];
  c.lineCap = "round";
  for (let i = 0; i < (w * h) / 52; i++) {
    const x = rng() * w, y = rng() * h;
    const len = 3 + rng() * 7;
    const lean = (rng() - 0.5) * 1.1;            // radians off straight up
    c.strokeStyle = blades[(rng() * blades.length) | 0];
    c.lineWidth = 0.6 + rng() * 0.9;
    c.beginPath();
    c.moveTo(x, y);
    c.quadraticCurveTo(x + lean * len * 0.4, y - len * 0.6,
                       x + lean * len, y - len);
    c.stroke();
  }

  // A few clumps catching the light, so the field is not uniformly busy.
  for (let i = 0; i < (w * h) / 26000; i++) {
    const x = rng() * w, y = rng() * h;
    for (let j = 0; j < 14; j++) {
      const bx = x + (rng() - 0.5) * 26, by = y + (rng() - 0.5) * 18;
      const len = 5 + rng() * 8;
      c.strokeStyle = "rgba(138,184,96,0.34)";
      c.lineWidth = 0.7 + rng() * 0.7;
      c.beginPath();
      c.moveTo(bx, by);
      c.quadraticCurveTo(bx + (rng() - 0.5) * 4, by - len * 0.6, bx + (rng() - 0.5) * 7, by - len);
      c.stroke();
    }
  }
  return turfBuf;
}

/* ---------------------------------------------------------------- geometry */
function fit(frame) {
  const stage = $("stage").getBoundingClientRect();
  const avail = Math.max(220, Math.min(stage.width - 32, stage.height - 32));
  if (state.view === "iso") {
    // fill the stage rather than a square inscribed in it — the isometric
    // board is wide and short, so a square wastes most of the width
    canvas.width = Math.round(Math.max(320, stage.width - 20));
    canvas.height = Math.round(Math.max(260, stage.height - 20));
  } else {
    const cell = Math.floor(avail / Math.max(frame.width, frame.height));
    canvas.width = cell * frame.width;
    canvas.height = cell * frame.height;
  }
}

/* The step a snake actually took between two consecutive body cells. On a
   wrapped board that step can leave one edge and arrive at the opposite one,
   and the two cells are then a whole board apart — a line drawn straight
   between them would cut across the entire map. Boards are at least 3 wide,
   so a gap of more than one cell can only be a wrap. */
function stepBetween(a, b, W, H) {
  let dx = b.x - a.x, dy = b.y - a.y;
  if (dx > 1) dx -= W; else if (dx < -1) dx += W;
  if (dy > 1) dy -= H; else if (dy < -1) dy += H;
  return { dx, dy };
}

/* One link, as the one or two strokes it takes to draw it. A link inside the
   board is a single stroke; a wrapped one is two, each running off its own
   edge into the cell just outside the board, so the snake reads as leaving
   here and arriving there rather than as a bar across the middle. */
function linkStrokes(a, b, W, H) {
  const { dx, dy } = stepBetween(a, b, W, H);
  if (a.x + dx === b.x && a.y + dy === b.y) return [[a, b]];
  return [
    [a, { x: a.x + dx, y: a.y + dy }],
    [{ x: b.x - dx, y: b.y - dy }, b],
  ];
}

/* Which way the head is facing: the offset from the first body cell that is
   not under the head, summed link by link so each fold is between neighbours
   (cells further down the body are legitimately more than one cell apart). */
function headingOf(body, W, H) {
  let dx = 0, dy = 0;
  for (let i = 1; i < body.length; i++) {
    const d = stepBetween(body[i], body[i - 1], W, H);
    dx += d.dx; dy += d.dy;
    if (dx || dy) return { x: Math.sign(dx), y: Math.sign(dy) };
  }
  return { x: 0, y: 1 };
}

function moodOf(frame, s) {
  if (!s.alive) return "dead";
  const ate = (frame.events || []).some((e) => e.kind === "ate" && e.snake === s.id);
  if (ate) return "pleased";
  // Nothing starves any more, so the mood is about room rather than hunger:
  // a snake with almost nowhere left to go is the one in trouble.
  if (room(frame, s) <= 1) return "frightened";
  if (room(frame, s) === 2) return "worried";
  return "calm";
}

/** How many of the four cells beside this head are free right now. */
function room(frame, s) {
  const W = frame.width, H = frame.height;
  const taken = new Set();
  for (const o of frame.obstacles || []) taken.add(o.x + "," + o.y);
  for (const other of frame.snakes) {
    if (!other.alive) continue;
    for (const c of other.body) taken.add(c.x + "," + c.y);
  }
  const head = s.body[0];
  let free = 0;
  for (const [dx, dy] of [[0, 1], [0, -1], [1, 0], [-1, 0]]) {
    let nx = head.x + dx, ny = head.y + dy;
    if (frame.wrapped) {
      nx = ((nx % W) + W) % W;
      ny = ((ny % H) + H) % H;
    } else if (nx < 0 || ny < 0 || nx >= W || ny >= H) {
      continue;                               // a wall is not room
    }
    if (!taken.has(nx + "," + ny)) free++;
  }
  return free;
}

/* A sumi face: two eyes turned to face `dir`, a mouth that carries the mood. */
function drawFace(px, py, r, dir, mood, tone) {
  ctx.save();
  ctx.translate(px, py);
  ctx.fillStyle = "#171613";
  ctx.strokeStyle = "#171613";
  ctx.lineCap = "round";

  const gx = dir.x * r * 0.22, gy = -dir.y * r * 0.22;   // eyes drift the way it looks
  const ex = r * 0.42, ey = -r * 0.12;
  const eye = (sx) => {
    if (mood === "dead") {
      ctx.lineWidth = Math.max(1, r * 0.11);
      const s = r * 0.16;
      ctx.beginPath();
      ctx.moveTo(sx - s, ey - s); ctx.lineTo(sx + s, ey + s);
      ctx.moveTo(sx + s, ey - s); ctx.lineTo(sx - s, ey + s);
      ctx.stroke();
      return;
    }
    if (mood === "pleased") {                              // happy arcs  ^ ^
      ctx.lineWidth = Math.max(1, r * 0.1);
      ctx.beginPath(); ctx.arc(sx, ey + r * 0.1, r * 0.2, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
      return;
    }
    if (mood === "frightened") {                           // big eyes, pinpoint pupils, raised brow
      ctx.beginPath(); ctx.arc(sx, ey, r * 0.26, 0, 7); ctx.fill();
      ctx.fillStyle = tone;
      ctx.beginPath(); ctx.arc(sx + gx * 0.3, ey + gy * 0.3, r * 0.07, 0, 7); ctx.fill();
      ctx.fillStyle = "#171613";
      ctx.lineWidth = Math.max(1, r * 0.08);
      const inward = sx < 0 ? 1 : -1;   // inner corner raised = scared
      ctx.beginPath();
      ctx.moveTo(sx - inward * r * 0.24, ey - r * 0.4);
      ctx.lineTo(sx + inward * r * 0.22, ey - r * 0.56);
      ctx.stroke();
      return;
    }
    const rr = mood === "worried" ? r * 0.2 : r * 0.16;    // worried = wide eyes
    ctx.beginPath(); ctx.arc(sx, ey, rr, 0, 7); ctx.fill();
    ctx.fillStyle = tone;
    ctx.beginPath(); ctx.arc(sx + gx * 0.5, ey + gy * 0.5, rr * 0.4, 0, 7); ctx.fill();
    ctx.fillStyle = "#171613";
  };
  eye(-ex); eye(ex);

  ctx.lineWidth = Math.max(1, r * 0.09);
  ctx.beginPath();
  const my = r * 0.34;
  if (mood === "pleased") { ctx.arc(0, my - r * 0.12, r * 0.26, Math.PI * 0.15, Math.PI * 0.85); }
  else if (mood === "worried") { ctx.arc(0, my + r * 0.18, r * 0.2, Math.PI * 1.15, Math.PI * 1.85); }
  else if (mood === "frightened") { ctx.arc(0, my + r * 0.02, r * 0.16, 0, 7); }  // small open "o"
  else if (mood === "dead") { ctx.moveTo(-r * 0.22, my); ctx.lineTo(r * 0.22, my); }
  else { ctx.moveTo(-r * 0.18, my); ctx.lineTo(r * 0.18, my); }
  ctx.stroke();
  ctx.restore();
}

/* ---------------------------------------------------------------- flat view */
function drawFlat(frame) {
  const H = frame.height;
  const cell = canvas.width / frame.width;
  const px = (x) => x * cell;
  const py = (y) => (H - 1 - y) * cell;
  const rng = jrand(0x5e3d);

  ctx.drawImage(turf(canvas.width, canvas.height), 0, 0);
  // A grid you can find when you look for it and otherwise cannot see. Light
  // rather than dark now: ink lines disappeared into the turf.
  ctx.strokeStyle = "rgba(226,240,210,0.07)"; ctx.lineWidth = 1;
  for (let i = 0; i <= frame.width; i++) { const w = (rng() - .5) * 2; ctx.beginPath(); ctx.moveTo(px(i) + w, 0); ctx.lineTo(px(i) + w, canvas.height); ctx.stroke(); }
  for (let i = 0; i <= H; i++) { const w = (rng() - .5) * 2; ctx.beginPath(); ctx.moveTo(0, i * cell + w); ctx.lineTo(canvas.width, i * cell + w); ctx.stroke(); }

  // obstacles: solid ink blocks
  for (const o of frame.obstacles) {
    ctx.fillStyle = "#2b2a25";
    ctx.fillRect(px(o.x) + 2, py(o.y) + 2, cell - 4, cell - 4);
  }
  // snakes: dry brush strokes, tapering to the tail, then a lighter dry pass
  for (const s of frame.snakes) {
    const col = s.colour || hue(s.id);
    const base = s.alive ? 1 : 0.4;
    ctx.strokeStyle = col; ctx.lineJoin = "round"; ctx.lineCap = "round";
    for (let pass = 0; pass < 2; pass++) {
      const a = pass ? 0.26 : 0.92;
      for (let i = 0; i < s.body.length - 1; i++) {
        ctx.globalAlpha = base * a;
        const t = i / Math.max(1, s.body.length - 1);
        ctx.lineWidth = (0.66 - 0.36 * t) * cell * (pass ? 0.5 : 1);
        // a link that wraps comes back as two strokes, each running off its
        // own edge; the canvas ends at the board, so what shows is a stub
        for (const [u, v] of linkStrokes(s.body[i], s.body[i + 1], frame.width, H)) {
          ctx.beginPath();
          ctx.moveTo(px(u.x) + cell / 2, py(u.y) + cell / 2);
          ctx.lineTo(px(v.x) + cell / 2, py(v.y) + cell / 2);
          ctx.stroke();
        }
      }
    }
    ctx.globalAlpha = base;
    const head = s.body[0];
    const hx = px(head.x) + cell / 2, hy = py(head.y) + cell / 2;
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(hx, hy, cell * 0.34, 0, 7); ctx.fill();
    ctx.globalAlpha = 1;
    drawFace(hx, hy, cell * 0.34, headingOf(s.body, frame.width, H), moodOf(frame, s), col);
    if (s.shout) {
      ctx.fillStyle = col; ctx.font = `italic ${Math.max(11, cell * 0.42)}px ${getComputedStyle(document.body).fontFamily}`;
      ctx.fillText(String(s.shout).slice(0, 20), hx + cell * 0.5, hy - cell * 0.5);
    }
  }
  ctx.globalAlpha = 1;

  // food: an apple sitting in the grass
  for (const f of frame.food) {
    apple(px(f.x) + cell / 2, py(f.y) + cell / 2, cell * 0.30);
  }

  margin(canvas.width, canvas.height);
}

/* The mount: a scroll's double rule, a sprig in one corner and the seal in
   the other. Drawn last, over everything, because it is the edge of the
   painting rather than part of the board. */
function margin(w, h) {
  // The edge of the field: a darker band all round, the way turf goes in the
  // shade of a fence. Replaces the ink border, which on grass read as a box
  // drawn over a photograph.
  const inset = Math.max(3, Math.min(w, h) * 0.012);
  ctx.save();
  const edge = ctx.createLinearGradient(0, 0, 0, h);
  edge.addColorStop(0, "rgba(12,26,10,0.45)");
  edge.addColorStop(0.08, "rgba(12,26,10,0)");
  edge.addColorStop(0.92, "rgba(12,26,10,0)");
  edge.addColorStop(1, "rgba(12,26,10,0.45)");
  ctx.fillStyle = edge; ctx.fillRect(0, 0, w, h);
  const side = ctx.createLinearGradient(0, 0, w, 0);
  side.addColorStop(0, "rgba(12,26,10,0.45)");
  side.addColorStop(0.06, "rgba(12,26,10,0)");
  side.addColorStop(0.94, "rgba(12,26,10,0)");
  side.addColorStop(1, "rgba(12,26,10,0.45)");
  ctx.fillStyle = side; ctx.fillRect(0, 0, w, h);
  ctx.strokeStyle = "rgba(226,240,210,0.10)"; ctx.lineWidth = 1;
  ctx.strokeRect(inset + 0.5, inset + 0.5, w - inset * 2 - 1, h - inset * 2 - 1);
  ctx.restore();
}

/* ----------------------------------------------------------------- iso view */
function iso(x, y, W, H) {
  const span = W + H;                                   // half-width units across
  const wByWidth = (canvas.width * 0.98) / (span * 0.5);
  const wByHeight = (canvas.height * 0.94) / (span * 0.5 * 0.5 + 0.6);
  const w = Math.min(wByWidth, wByHeight);
  const hw = w / 2, hh = w * 0.25;
  const ox = canvas.width / 2;
  const oy = (canvas.height - (W + H - 2) * hh) / 2 - w * 0.10;
  return { sx: ox + (x - y) * hw, sy: oy + (x + y) * hh, hw, hh, w };
}

function diamond(sx, sy, hw, hh, lift) {
  ctx.beginPath();
  ctx.moveTo(sx, sy - hh - lift);
  ctx.lineTo(sx + hw, sy - lift);
  ctx.lineTo(sx, sy + hh - lift);
  ctx.lineTo(sx - hw, sy - lift);
  ctx.closePath();
}

/* Shadows have to taper with the body, but a per-link stroke stacks alpha at
   every joint and blotches. So each group is painted opaque on an offscreen
   layer and that layer is composited once. */
let shadowBuf = null;
function shadowCtx() {
  if (!shadowBuf) shadowBuf = document.createElement("canvas");
  if (shadowBuf.width !== canvas.width || shadowBuf.height !== canvas.height) {
    shadowBuf.width = canvas.width; shadowBuf.height = canvas.height;
  }
  const sc = shadowBuf.getContext("2d");
  sc.clearRect(0, 0, shadowBuf.width, shadowBuf.height);
  sc.fillStyle = "#1a1a17"; sc.strokeStyle = "#1a1a17";
  sc.lineCap = "round"; sc.lineJoin = "round";
  return sc;
}

function shadowPass(W, H, snakes, alpha) {
  if (!snakes.length) return;
  const sc = shadowCtx();
  for (const sn of snakes) {
    const n = sn.body.length;
    if (!n) continue;
    // sits on the ground plane, nudged a hair downhill: a contact shadow
    const at = (c) => { const q = iso(c.x, c.y, W, H); return { x: q.sx, y: q.sy + q.hh * 0.1, w: q.w }; };
    const scale = sn.alive ? 1 : 0.7;
    for (let i = 1; i < n; i++) {
      const t = i / Math.max(1, n - 1);
      for (const [u, v] of linkStrokes(sn.body[i - 1], sn.body[i], W, H)) {
        const a = at(u), b = at(v);
        sc.lineWidth = b.w * (0.58 - 0.34 * t) * scale; // ~83% of the body width
        sc.beginPath(); sc.moveTo(a.x, a.y); sc.lineTo(b.x, b.y); sc.stroke();
      }
    }
    const h0 = at(sn.body[0]);
    sc.beginPath();
    sc.ellipse(h0.x, h0.y, h0.w * 0.30 * scale, h0.w * 0.26 * scale, 0, 0, 7);
    sc.fill();
  }
  ctx.save(); ctx.globalAlpha = alpha; ctx.drawImage(shadowBuf, 0, 0); ctx.restore();
}

function drawIso(frame) {
  const W = frame.width, H = frame.height;
  ctx.drawImage(turf(canvas.width, canvas.height), 0, 0);

  // 1. the floor — flat tiles, back to front
  for (let s = 0; s <= W + H - 2; s++) {
    for (let x = 0; x < W; x++) {
      const y = s - x;
      if (y < 0 || y >= H) continue;
      const p = iso(x, y, W, H);
      diamond(p.sx, p.sy, p.hw, p.hh, 0);
      // Two greens, checkered, so the iso floor reads as mown turf rather
      // than as one flat slab.
      ctx.fillStyle = ((x + y) & 1) ? "#2d4a24" : "#33542a"; ctx.fill();
      ctx.strokeStyle = "rgba(226,240,210,0.05)"; ctx.lineWidth = 1; ctx.stroke();
    }
  }

  // 1b. contact shadows, tapering with the body — the living cast a firmer one
  shadowPass(W, H, frame.snakes.filter((s) => s.alive), 0.15);
  shadowPass(W, H, frame.snakes.filter((s) => !s.alive), 0.07);

  // 2. everything that stands up — obstacles, snake segments, food — in ONE
  //    depth-sorted pass (by x+y), so an obstacle nearer the camera than a
  //    snake segment draws over it, and vice versa.
  const standing = [];
  for (const c of frame.obstacles) standing.push({ x: c.x, y: c.y, kind: "obs", d: c.x + c.y, i: 0 });
  for (const c of frame.food) standing.push({ x: c.x, y: c.y, kind: "food", d: c.x + c.y, i: 0 });
  for (const s of frame.snakes) {
    const col = s.colour || hue(s.id);
    s.body.forEach((c, i) =>
      standing.push({ x: c.x, y: c.y, kind: "seg", d: c.x + c.y, i, s, col, head: i === 0 })
    );
  }
  standing.sort((a, b) => a.d - b.d || a.x - b.x || a.i - b.i);

  for (const g of standing) {
    const p = iso(g.x, g.y, W, H);
    if (g.kind === "obs") {
      block(p, "#2b2a25", 0.5, false);
      continue;
    }
    if (g.kind === "food") {
      // The apple paints its own shadow and highlight; the seal's rectangles
      // used to be drawn around it and are gone.
      ctx.save(); ctx.translate(p.sx, p.sy - p.w * 0.34);
      apple(0, 0, p.w * 0.19);
      ctx.restore();
      continue;
    }
    // Snake segment — a sumi brush-stroke tube. Each cell draws only its OWN
    // half of the links to its neighbours, so every mark sits inside the cell
    // it was sorted by. Drawing a whole link at one end's depth used to let the
    // far half punch through an obstacle standing between the two cells.
    const s = g.s, n = s.body.length;
    const tailT = (i) => i / Math.max(1, n - 1);
    // a low glide — the body rides just proud of the surface, not hovering
    const liftOf = (i) => s.alive ? p.w * (0.12 - 0.06 * tailT(i)) : p.w * 0.04;
    const aliveA = s.alive ? 1 : 0.4;
    const atCell = (c, i) => { const q = iso(c.x, c.y, W, H); return [q.sx, q.sy - liftOf(i)]; };
    const at = (i) => atCell(s.body[i], i);
    // where neighbour j lies as seen from cell i: one step away, even when the
    // link wraps, so the half-link leaves the board edge instead of reaching
    // back across it
    const beside = (i, j) => {
      const d = stepBetween(s.body[i], s.body[j], W, H);
      return { x: s.body[i].x + d.dx, y: s.body[i].y + d.dy };
    };
    const half = (i, j) => {
      const a = at(i), b = atCell(beside(i, j), j);
      return [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    };

    ctx.globalAlpha = aliveA;
    ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = g.col;

    const spine = [];
    if (g.i > 0) spine.push(half(g.i, g.i - 1));      // half-link toward the head
    spine.push(at(g.i));
    if (g.i < n - 1) spine.push(half(g.i, g.i + 1));  // half-link toward the tail
    if (spine.length > 1) {
      const wide = (0.70 - 0.42 * tailT(g.i)) * p.w;
      const trace = () => {
        ctx.beginPath();
        spine.forEach(([x, y], k) => (k ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
        ctx.stroke();
      };
      ctx.lineWidth = wide; trace();
      if (s.alive) {                                 // a lighter dry brush pass
        ctx.save();
        ctx.globalAlpha = 0.24; ctx.lineWidth = wide * 0.5; trace();
        ctx.restore();
      }
    }

    if (g.head) {
      const cx = p.sx, cy = p.sy - liftOf(0);
      ctx.fillStyle = g.col;
      ctx.beginPath();
      ctx.ellipse(cx, cy, p.w * 0.35, p.w * 0.30, 0, 0, 7);
      ctx.fill();
      drawFace(cx, cy - p.w * 0.04, p.w * 0.30, headingOf(s.body, W, H), moodOf(frame, s), g.col);
      if (s.shout) {
        ctx.globalAlpha = 1; ctx.fillStyle = g.col;
        ctx.font = `italic ${Math.max(11, p.w * 0.34)}px ${getComputedStyle(document.body).fontFamily}`;
        ctx.fillText(String(s.shout).slice(0, 18), cx + p.hw * 0.6, cy - p.hh);
      }
    }
    ctx.globalAlpha = 1;
  }

  margin(canvas.width, canvas.height);
}

/* a lifted ink tile: shadow, two shaded sides, a wash top */
function block(p, col, liftFrac, faceUp) {
  const lift = p.w * liftFrac;
  // ground shadow
  ctx.fillStyle = "rgba(26,26,23,0.12)";
  diamond(p.sx, p.sy + p.hh * 0.25, p.hw * 0.92, p.hh * 0.92, 0); ctx.fill();
  if (lift > 1) {
    ctx.fillStyle = shade(col, -0.30);
    ctx.beginPath();
    ctx.moveTo(p.sx - p.hw, p.sy); ctx.lineTo(p.sx, p.sy + p.hh);
    ctx.lineTo(p.sx, p.sy + p.hh - lift); ctx.lineTo(p.sx - p.hw, p.sy - lift); ctx.closePath(); ctx.fill();
    ctx.fillStyle = shade(col, -0.15);
    ctx.beginPath();
    ctx.moveTo(p.sx, p.sy + p.hh); ctx.lineTo(p.sx + p.hw, p.sy);
    ctx.lineTo(p.sx + p.hw, p.sy - lift); ctx.lineTo(p.sx, p.sy + p.hh - lift); ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = faceUp ? washed(col) : col;
  diamond(p.sx, p.sy, p.hw, p.hh, lift); ctx.fill();
  ctx.strokeStyle = shade(col, -0.35); ctx.lineWidth = 1; ctx.stroke();
}

function toRGB(hex) { const n = parseInt(hex.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function shade(hex, amt) {
  let [r, g, b] = toRGB(hex);
  if (amt < 0) { r *= 1 + amt; g *= 1 + amt; b *= 1 + amt; }
  else { r += (255 - r) * amt; g += (255 - g) * amt; b += (255 - b) * amt; }
  return `rgb(${r | 0},${g | 0},${b | 0})`;
}
function washed(hex) { const [r, g, b] = toRGB(hex); return `rgba(${r},${g},${b},0.86)`; }

/* ------------------------------------------------------------------ dispatch */
function draw() {
  const frame = state.frames[state.idx];
  if (!frame) return;
  fit(frame);
  (state.view === "iso" ? drawIso : drawFlat)(frame);
  renderHud(frame);
}

function renderHud(frame) {
  $("m-map").textContent = state.header ? state.header.map_id : (frame.map_id || "—");
  $("m-seed").textContent = state.header ? state.header.seed : "—";
  $("m-turn").textContent = frame.turn;
  $("m-status").textContent = frame.terminal_reason ? frame.terminal_reason.replace(/_/g, " ") : "";
  $("scrub").max = state.frames.length - 1;
  $("scrub").value = state.idx;
  $("scrub-label").textContent = `${frame.turn} / ${lastTurn()}`;

  // `respawn` on the frame is authoritative; the fallback covers old replays.
  const respawns = frame.respawn ?? frame.snakes.some((s) => s.respawns > 0 || s.respawn_in != null);
  // The table ranks on the longest a snake has been, kills breaking a tie, so
  // the live standing is read the same way.
  const peak = (s) => s.max_length ?? s.length;
  const ranked = [...frame.snakes].sort(
    (a, b) => peak(b) - peak(a) || b.kills - a.kills || a.id - b.id
  );
  $("snakes").innerHTML = ranked.map((s, i) => {
    const col = s.colour || hue(s.id);
    let label;
    if (s.alive) label = "#" + (i + 1);
    else if (s.respawn_in != null) label = "back in " + Math.max(0, s.respawn_in);
    else label = s.death_cause ? s.death_cause.kind.replace(/_/g, " ") : "out";
    const extra = respawns ? ` · deaths ${s.deaths}` : "";
    return `<div class="snake-row ${s.alive ? "" : "dead"}">
      <div class="name"><span class="swatch" style="background:${col}"></span>${escapeHtml(s.name)}
        <span class="rank">${label}</span></div>
      <div class="stat">len ${s.length} · best ${peak(s)} · kills ${s.kills}${extra}${s.latency_ms ? " · " + s.latency_ms.toFixed(1) + "ms" : ""}</div>
      <div class="bar"><i style="width:${Math.min(100, peak(s))}%;background:${col}"></i></div>
    </div>`;
  }).join("");

  $("events").innerHTML = collectEvents().map((e) => `<div class="ev ${e.cls}"><span class="t">t${e.turn}</span> ${e.text}</div>`).join("") || "<div class='ev'>—</div>";
  $("events").scrollTop = $("events").scrollHeight;
}

function lastTurn() { const f = state.frames[state.frames.length - 1]; return f ? f.turn : 0; }
function nameOf(frame, id) { const s = frame.snakes.find((s) => s.id === id); return s ? s.name : "snake " + id; }

function collectEvents() {
  const out = [];
  for (let i = 0; i <= state.idx && i < state.frames.length; i++) {
    for (const e of (state.frames[i].events || [])) {
      const f = state.frames[i];
      if (e.kind === "ate") out.push({ turn: e.turn, cls: "eat", text: `${nameOf(f, e.snake)} eats — length ${e.length}` });
      else if (e.kind === "died") out.push({ turn: e.turn, cls: "kill", text: `${nameOf(f, e.snake)} falls — ${e.cause.kind.replace(/_/g, " ")}` });
      else if (e.kind === "respawned") out.push({ turn: e.turn, cls: "eat", text: `${nameOf(f, e.snake)} returns at ${e.at.x},${e.at.y}` });
      else if (e.kind === "head_to_head") out.push({ turn: e.turn, cls: "kill", text: `heads meet at ${e.cell.x},${e.cell.y}` });
      else if (e.kind === "policy_timeout") out.push({ turn: e.turn, cls: "kill", text: `${nameOf(f, e.snake)} too slow (${e.elapsed_ms.toFixed(0)}ms)` });
      else if (e.kind === "policy_error") out.push({ turn: e.turn, cls: "kill", text: `${nameOf(f, e.snake)} errored` });
    }
  }
  return out.slice(-60);
}

function escapeHtml(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

/* ----------------------------------------------------------------- the wire
   When this page is an iframe in a broadcast, the page around it has to know
   what is happening on the board without reading the board: when the game is
   ready, when something worth an overlay happens, and when it is over. So the
   viewer says so, and says nothing else. The broadcast decides what a kill
   looks like; the viewer decides when there was one. */

const embedded = window.parent && window.parent !== window;

function tell(message) {
  if (!embedded) return;
  try { window.parent.postMessage(message, "*"); } catch (e) { /* not ours to fix */ }
}

/* The events of one turn, forwarded as they are played. Only the kinds an
   audience can see. */
function announce(frame) {
  for (const e of (frame.events || [])) {
    if (e.kind === "ate") {
      tell({ type: "replay-event", kind: "ate", turn: e.turn, snake: nameOf(frame, e.snake), length: e.length });
    } else if (e.kind === "died") {
      tell({
        type: "replay-event", kind: "died", turn: e.turn,
        snake: nameOf(frame, e.snake), cause: (e.cause || {}).kind || "",
      });
    } else if (e.kind === "head_to_head") {
      tell({ type: "replay-event", kind: "head_to_head", turn: e.turn });
    } else if (e.kind === "respawned") {
      tell({ type: "replay-event", kind: "respawned", turn: e.turn, snake: nameOf(frame, e.snake) });
    }
  }
}

function finalOrder() {
  const frame = state.frames[state.frames.length - 1];
  if (!frame) return [];
  // The last frame knows who is still standing and how long; placement itself
  // is the engine's, and the engine is not in this page. Alive first, then
  // whoever lasted longest, which is how this profile ranks anyway.
  return [...frame.snakes]
    .sort((a, b) => (b.alive - a.alive) || (b.length - a.length) || (b.food_eaten - a.food_eaten))
    .map((s) => ({ name: s.name, alive: s.alive, length: s.length, food: s.food_eaten, kills: s.kills }));
}

/* ------------------------------------------------------------------ playback */
function show(i) { state.idx = Math.max(0, Math.min(state.frames.length - 1, i)); draw(); }
function play() {
  if (state.playing) return stop();
  state.playing = true; $("play").textContent = "❚❚ pause";
  const tick = () => {
    if (!state.playing) return;
    if (state.idx >= state.frames.length - 1) {
      if (state.live && !state.ended) { state.timer = setTimeout(tick, 120); return; }
      stop();
      // Full time, said once. A broadcast waits on this to cut to its slate,
      // so a replay that is scrubbed back and played again must not say it
      // twice - see `state.told`.
      if (!state.told) { state.told = true; tell({ type: "replay-ended", order: finalOrder() }); }
      return;
    }
    show(state.idx + 1);
    announce(state.frames[state.idx]);
    state.timer = setTimeout(tick, TURN_MS / speed());
  };
  tick();
}
function stop() { state.playing = false; $("play").textContent = "▶ play"; clearTimeout(state.timer); }

$("play").onclick = play;
$("step").onclick = () => { stop(); show(state.idx + 1); };
$("scrub").oninput = (e) => { stop(); show(+e.target.value); };
$("view-seg").querySelectorAll("button").forEach((b) => {
  b.classList.toggle("on", b.dataset.view === state.view);
  b.onclick = () => {
    state.view = b.dataset.view;
    try { localStorage.setItem("snk.view", state.view); } catch (e) {}
    $("view-seg").querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b));
    draw();
  };
});
window.addEventListener("resize", draw);
setInterval(() => { if (state.frames.length && !state.playing) draw(); }, 500);

/* ------------------------------------------------------------------- sources */
const qs = new URLSearchParams(location.search);

if (qs.get("chrome") === "off") document.body.classList.add("chromeless");
if (qs.get("speed")) {
  // The broadcast picks a pace; the select still shows which one, so a viewer
  // opened out of a broadcast is not lying about what it is doing. A pace the
  // select does not offer is ignored rather than half-applied: the control and
  // the playback say the same thing or the control is a lie.
  const wanted = String(qs.get("speed"));
  const option = [...$("speed").options].find((o) => o.value === wanted);
  if (option) $("speed").value = wanted;
}

async function loadReplay(name) {
  // A season keeps only the replays somebody has asked for, so this request
  // may be what causes the game to be played again. It can therefore take as
  // long as the game does; there is nothing to do about that but wait.
  const season = qs.get("season");
  const url = `api/replay?name=${encodeURIComponent(name)}`
    + (season ? `&season=${encodeURIComponent(season)}` : "");
  const data = await fetch(url).then((r) => r.json());
  if (data.error) {
    $("m-status").textContent = data.error;
    tell({ type: "replay-failed", error: data.error });
    return;
  }
  state.header = data.header; state.frames = data.frames; state.ended = true;
  tell({
    type: "replay-loaded",
    turns: state.frames.length,
    map_id: data.header ? data.header.map_id : "",
    seed: data.header ? data.header.seed : null,
    snakes: (state.frames[0] ? state.frames[0].snakes : []).map((s) => s.name),
  });
  const jump = qs.get("frame");
  if (jump != null) {
    show(jump === "end" ? state.frames.length - 1 : +jump);  // paused, for a still
  } else {
    show(Math.max(0, Math.min(state.frames.length - 1, +(qs.get("at") || 0))));
    play();
  }
}

function followGame(id) {
  state.live = true;
  const src = new EventSource(`api/stream?id=${encodeURIComponent(id)}`);
  src.onmessage = (msg) => {
    const data = JSON.parse(msg.data);
    if (data.type === "frame") {
      const atEnd = state.idx >= state.frames.length - 1;
      state.frames.push(data.snapshot);
      if (!state.header && data.snapshot) state.header = { map_id: data.snapshot.map_id, seed: qs.get("seed") || "—" };
      if (atEnd) show(state.frames.length - 1); else draw();
      if (!state.playing && state.frames.length === 1) play();
    } else if (data.type === "end") {
      state.ended = true; src.close();
      if (data.result) $("m-status").textContent = data.result.terminal_reason.replace(/_/g, " ");
    }
  };
  src.onerror = () => { state.ended = true; src.close(); };
}

if (qs.get("replay")) loadReplay(qs.get("replay"));
else if (qs.get("game")) followGame(qs.get("game"));
else $("m-status").textContent = "no source — open from the dashboard";
</script>
</body>
</html>
